name: windows-msvc

on:
  push:
    branches: [ main ]
  pull_request:

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_FEATURE_FLAGS: manifests,registries,binarycaching

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC dev env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Restore vcpkg and install deps
        id: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 271a5b8850aa50f9a40269cbf3cf414b36e333d6
          appendedCacheKey: ${{ hashFiles('vcpkg.json') }}

      - name: Export resolved vcpkg root
        shell: pwsh
        run: |
          "VCPKG_ROOT=${{ steps.vcpkg.outputs.vcpkgRoot }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sanity check vcpkg
        shell: cmd
        run: |
          echo VCPKG_ROOT=%VCPKG_ROOT%
          dir %VCPKG_ROOT%
          dir %VCPKG_ROOT%\scripts\buildsystems
          if not exist %VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake (
            echo Missing vcpkg toolchain file!
            exit /b 1
          )
          "%VCPKG_ROOT%\vcpkg.exe" version
          "%VCPKG_ROOT%\vcpkg.exe" list || ver >NUL

      - name: Configure (CMake + vcpkg toolchain)
        shell: cmd
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          -DUSE_MKL=OFF
          -DENABLE_OPENMP=ON
          -DARCH=avx2

      - name: Build
        shell: cmd
        run: cmake --build build --config Release -- -v

      - name: Package artifact
        shell: cmd
        run: |
          mkdir artifact
          copy build\kspaceFirstOrder-OMP.exe artifact\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwave-omp-windows
          path: artifact/
