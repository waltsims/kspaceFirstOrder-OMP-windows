name: windows-msvc

on:
  push:
    branches: [ main ]
  pull_request:

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_FEATURE_FLAGS: manifests,registries,binarycaching

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC dev env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Restore vcpkg and install deps
        id: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 271a5b8850aa50f9a40269cbf3cf414b36e333d6
          appendedCacheKey: ${{ hashFiles('vcpkg.json') }}

      - name: Resolve vcpkg root
        shell: pwsh
        run: |
          $root = "${{ steps.vcpkg.outputs.vcpkgRoot }}"
          if (-not $root) {
            Write-Error "run-vcpkg did not expose a vcpkg root."
            exit 1
          }

          if (-not (Test-Path -Path $root)) {
            Write-Error "Resolved vcpkg root '$root' does not exist."
            exit 1
          }

          $toolchain = Join-Path $root 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path -Path $toolchain)) {
            Write-Host "Contents of $root:" 
            Get-ChildItem -Path $root
            Write-Error "Missing vcpkg toolchain file at $toolchain"
            exit 1
          }

          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Using vcpkg root: $root"

      - name: Sanity check vcpkg
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Get-ChildItem $env:VCPKG_ROOT
          Get-ChildItem (Join-Path $env:VCPKG_ROOT 'scripts/buildsystems')
          & "$env:VCPKG_ROOT/vcpkg.exe" version
          & "$env:VCPKG_ROOT/vcpkg.exe" list

      - name: Configure (CMake + vcpkg toolchain)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DUSE_MKL=OFF `
            -DENABLE_OPENMP=ON `
            -DARCH=avx2

      - name: Build
        shell: cmd
        run: cmake --build build --config Release -- -v

      - name: Package artifact
        shell: cmd
        run: |
          mkdir artifact
          copy build\kspaceFirstOrder-OMP.exe artifact\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwave-omp-windows
          path: artifact/
