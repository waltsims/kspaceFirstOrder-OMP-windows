name: windows-msvc

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_COMMIT: 271a5b8850aa50f9a40269cbf3cf414b36e333d6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC dev env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Clone vcpkg
        shell: cmd
        run: |
          if exist "%VCPKG_ROOT%" (
            echo "vcpkg already cloned at %VCPKG_ROOT%"
          ) else (
            git clone https://github.com/microsoft/vcpkg.git "%VCPKG_ROOT%"
          )
          pushd "%VCPKG_ROOT%"
          git fetch --all --tags
          git checkout %VCPKG_COMMIT%
          .\bootstrap-vcpkg.bat
          popd

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}\installed
            ${{ env.VCPKG_ROOT }}\packages
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg packages
        shell: cmd
        run: |
          "%VCPKG_ROOT%\vcpkg.exe" install hdf5[hl]:x64-windows fftw3[core,threads]:x64-windows

      - name: Configure (CMake + vcpkg toolchain)
        run: >
          cmake -S . -B build
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DUSE_MKL=OFF
          -DENABLE_OPENMP=ON
          -DARCH=avx2

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package artifact
        run: |
          mkdir artifact
          copy build\kspaceFirstOrder-OMP.exe artifact\
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwave-omp-windows
          path: artifact/
