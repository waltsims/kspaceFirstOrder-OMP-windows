name: Windows container build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable Git long paths
        run: git config --system core.longpaths true

      - name: Cache vcpkg
        uses: actions/cache@v3
        with:
          path: C:\\Users\\runneradmin\\vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $vcpkgRoot = "$env:USERPROFILE\vcpkg"
          ./Containers/windows/install-deps.ps1 -VcpkgRoot $vcpkgRoot

      - name: Configure with CMake
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $env:VCPKG_ROOT = Resolve-Path "$env:USERPROFILE\vcpkg"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $installationPath = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installationPath) {
            throw 'Visual Studio installation not found.'
          }

          $devCmd = Join-Path $installationPath 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat not found under $installationPath"
          }

          cmd /c "`"$devCmd`" -arch=x64 -host_arch=x64 && cmake --preset windows-msvc-vcpkg-release"

      - name: Build with CMake
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $env:VCPKG_ROOT = Resolve-Path "$env:USERPROFILE\vcpkg"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $installationPath = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installationPath) {
            throw 'Visual Studio installation not found.'
          }

          $devCmd = Join-Path $installationPath 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat not found under $installationPath"
          }

          cmd /c "`"$devCmd`" -arch=x64 -host_arch=x64 && cmake --build --preset windows-msvc-vcpkg-release"

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows-release
          if-no-files-found: warn
